    <script>
      // Remove browser extension injected elements
      function removeExtensions() {
        const selectors = [
          '[id*="cf-"]', '[class*="cf-"]',
          '[id*="turnstile"]', '[class*="turnstile"]',
          '[id*="challenge"]', '[class*="challenge"]',
          '[id*="captcha"]', '[class*="captcha"]',
          'iframe[src*="challenges"]', 'iframe[src*="turnstile"]',
          'iframe[src*="captcha"]',
          '[data-testid*="extension"]'
        ];
        selectors.forEach(sel => {
          document.querySelectorAll(sel).forEach(el => {
            if (el.parentElement) el.parentElement.removeChild(el);
          });
        });
      }
      removeExtensions();
      new MutationObserver(removeExtensions).observe(document.body, { childList: true, subtree: true });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
